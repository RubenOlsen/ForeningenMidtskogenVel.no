title: "Arbeid for felles interesser i forhold til Bjørnefjorden kommune og utbyggere i området."
text: "Foreningen Midtskogen Vel verner og ivaretek friluftsomådet Midtskogen i Os sentrum. Friområdet er ein grøn lunge midt i nabolaget og ein lågterskel møteplass for born, ungdom og vaksne. Her kan ein leika, spela ball, ta ein prat over gjerdet – eller berre pusta ut. Slik bidreg området til trivsel, helse og tryggleik i kvardagen."


image: "images/forside.png"

importantTitle: "Spørreundersøkelse "
importantText: "Er du for eller i mot eit byggeprosjekt på Mobergsneset med eit hotell som vil bli meir enn 40 meter høgt og eit totalt golvareal på meir enn 20 000 rutemeter?
Til samanikning Bergen rådhus er omlag 50 meter høgt og har eit golvareal på 10 400 rutemeter."
